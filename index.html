<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playdate Pixel Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark"></span>
          <div>
            <h1>Playdate Pixel Studio</h1>
            <p>400 x 240, 1-bit artboard</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="undoBtn" class="icon-button" title="Undo" aria-label="Undo">↶</button>
          <button id="redoBtn" class="icon-button" title="Redo" aria-label="Redo">↷</button>
          <button id="exportBtn" class="text-button">Export PNG</button>
          <button id="previewBtn" class="primary-button">Preview on Playdate</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="tools-panel" aria-label="Drawing tools">
          <div class="panel-section">
            <h2>Tools</h2>
            <div class="tool-grid" id="toolGrid">
              <button class="tool-button is-active" data-tool="pencil" title="Pencil" aria-label="Pencil">P</button>
              <button class="tool-button" data-tool="eraser" title="Eraser" aria-label="Eraser">E</button>
              <button class="tool-button" data-tool="line" title="Line" aria-label="Line">L</button>
              <button class="tool-button" data-tool="rect" title="Rectangle" aria-label="Rectangle">□</button>
              <button class="tool-button" data-tool="fill" title="Fill" aria-label="Fill">F</button>
              <button class="tool-button" data-tool="dither" title="Dither" aria-label="Dither">D</button>
            </div>
          </div>

          <div class="panel-section">
            <h2>Brush</h2>
            <label class="control-row">
              <span>Size</span>
              <input id="brushSize" type="range" min="1" max="8" value="1" />
              <strong id="brushSizeValue">1</strong>
            </label>
            <label class="toggle-row">
              <input id="mirrorX" type="checkbox" />
              <span>Mirror X</span>
            </label>
            <label class="toggle-row">
              <input id="mirrorY" type="checkbox" />
              <span>Mirror Y</span>
            </label>
          </div>

          <div class="panel-section">
            <h2>View</h2>
            <label class="control-row">
              <span>Zoom</span>
              <input id="zoomLevel" type="range" min="1" max="6" value="3" />
              <strong id="zoomValue">3x</strong>
            </label>
            <label class="toggle-row">
              <input id="gridToggle" type="checkbox" checked />
              <span>Grid</span>
            </label>
          </div>
        </aside>

        <section class="canvas-stage" aria-label="Pixel art canvas">
          <div class="stage-meta">
            <div>
              <strong id="activeLayerName">Layer 1</strong>
              <span id="statusText">Pencil ready</span>
            </div>
            <div class="pixel-readout">
              <span id="cursorReadout">x: -- y: --</span>
            </div>
          </div>
          <div class="canvas-rail">
            <div id="canvasWrap" class="canvas-wrap has-grid">
              <canvas id="artCanvas" width="400" height="240"></canvas>
            </div>
          </div>
        </section>

        <aside class="layers-panel" aria-label="Layers">
          <div class="panel-header">
            <h2>Layers</h2>
            <div class="mini-actions">
              <button id="addLayerBtn" class="icon-button" title="Add layer" aria-label="Add layer">+</button>
              <button id="duplicateLayerBtn" class="icon-button" title="Duplicate layer" aria-label="Duplicate layer">⧉</button>
              <button id="deleteLayerBtn" class="icon-button" title="Delete layer" aria-label="Delete layer">−</button>
            </div>
          </div>
          <div id="layerList" class="layer-list"></div>
          <div class="panel-section">
            <label class="control-row">
              <span>Opacity</span>
              <input id="layerOpacity" type="range" min="15" max="100" value="100" />
              <strong id="layerOpacityValue">100%</strong>
            </label>
            <div class="layer-actions">
              <button id="moveLayerUpBtn" class="text-button">Move Up</button>
              <button id="moveLayerDownBtn" class="text-button">Move Down</button>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <div id="previewOverlay" class="preview-overlay" hidden>
      <div class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <div class="preview-header">
          <div>
            <h2 id="previewTitle">Playdate Preview</h2>
            <p>Flattened 1-bit screen output</p>
          </div>
          <button id="closePreviewBtn" class="icon-button" title="Close preview" aria-label="Close preview">×</button>
        </div>
        <div class="playdate-device">
          <div class="device-screen">
            <canvas id="previewCanvas" width="400" height="240"></canvas>
          </div>
          <div class="device-controls">
            <div class="dpad">
              <span></span>
            </div>
            <div class="menu-button"></div>
            <div class="ab-buttons">
              <span>A</span>
              <span>B</span>
            </div>
            <div class="crank"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
